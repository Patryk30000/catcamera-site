<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CatCamera</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      text-align: center;
      padding-top: 50px;
    }

    .container {
      background: white;
      width: 350px;
      margin: auto;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
    }

    p {
      color: #666;
    }

    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 15px;
    }

    button:hover {
      background-color: #0056b3;
    }

    iframe {
      width: 250px;
      height: 150px;
      border: 2px solid #ccc;
      margin-top: 20px;
      background: black;
    }

    .label {
      margin-top: 15px;
      font-weight: bold;
      font-size: 20px;
      color: #222;
    }

    .status {
      color: red;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Connect CatCamera.</h1>

    <div class="label">CatCamera</div>

    <iframe></iframe>

    <div class="status">Camera Not Connected</div>

    <button>
      Click Here To Get PRO Version.
    </button>
  </div>
</body>
</html>
